name: render
run-name: recap ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id: { description: "Job id (zip is uploaded to the 'jobs' release as <id>.zip)", required: true }
      lang: { default: "en" }
      aspect: { default: "9:16" }
      voice: { default: "" }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JOB: ${{ inputs.job_id }}
      LANG_CODE: ${{ inputs.lang }}
      ASPECT: ${{ inputs.aspect }}
      VOICE: ${{ inputs.voice }}
    steps:
      - uses: actions/checkout@v4

      - name: Download pages
        run: |
          [[ "$JOB" =~ ^[a-f0-9]{12}$ ]] || { echo "bad job id"; exit 1; }
          gh release download jobs -p "$JOB.zip" -D in

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0-int8 }

      - name: Install voice
        run: |
          pip install -q -r requirements.txt
          mkdir -p models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -sL -o models/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          [ -f models/voices-v1.0.bin ] || curl -sL -o models/voices-v1.0.bin $B/voices-v1.0.bin

      - name: Write script
        run: python pipeline.py "in/$JOB.zip" --stage script --lang "$LANG_CODE"

      - name: Record voice
        run: |
          ARGS=(--stage voice --lang "$LANG_CODE")
          [ -n "$VOICE" ] && ARGS+=(--voice "$VOICE")
          python pipeline.py "in/$JOB.zip" "${ARGS[@]}"

      - name: Make video
        run: |
          mkdir -p out
          python pipeline.py "in/$JOB.zip" --stage video --out "out/$JOB.mp4" --aspect "$ASPECT"

      - name: Upload video
        run: gh release upload jobs "out/$JOB.mp4" "out/${JOB}_script.txt" --clobber

      - name: Clean up
        if: always()
        run: |
          gh release delete-asset jobs "$JOB.zip" -y || true
          # delete anything older than 3 days so storage never fills up
          cutoff=$(date -d '3 days ago' +%s)
          gh api "repos/${{ github.repository }}/releases/tags/jobs" --jq '.assets[] | "\(.id) \(.created_at)"' |
          while read id created; do
            [ "$(date -d "$created" +%s)" -lt "$cutoff" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
